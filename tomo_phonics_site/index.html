<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Study Mate｜フォニックス d & t</title>
  <style>
    :root{--blue:#8eb6cd;--ink:#243f4c;--white:#fff;--accent:#0b84ff;--shadow:0 12px 32px rgba(17,47,63,.16)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#eef5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
    header{position:sticky;top:0;z-index:20;background:rgba(238,245,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(36,63,76,.08)}
    .topbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}.brand img{display:block;width:210px;max-height:48px;object-fit:contain;mix-blend-mode:multiply}.brand small{display:block;font-size:12px;font-weight:600;opacity:.65}
    .nav{display:flex;gap:6px;overflow:auto;padding-bottom:1px}
    .nav button{border:0;background:#fff;color:var(--ink);width:34px;height:34px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(17,47,63,.08)}
    .nav button.active{background:var(--ink);color:#fff}
    main{max-width:1180px;margin:0 auto;padding:22px 16px 52px}
    .hint{margin:0 auto 18px;text-align:center;font-size:14px;line-height:1.7;opacity:.78}
    .slide{display:none;position:relative;margin:auto;aspect-ratio:16/9;max-width:1080px;background:#fff;box-shadow:var(--shadow);overflow:hidden;border-radius:14px}
    .slide.active{display:block}.slide-brand-overlay{position:absolute;left:2.5%;bottom:2.4%;width:34%;height:16%;background:#fff;z-index:4;display:flex;align-items:center;padding:0 1.4%}.slide-brand-overlay img{display:block;width:78%;height:auto;max-height:74%;object-fit:contain;object-position:left center}
    .slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .audio-btn{position:absolute;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.96);background:rgba(11,132,255,.94);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,78,158,.18);transition:transform .12s ease,background .12s ease;z-index:5}
    .audio-btn:hover{transform:translateY(-50%) scale(1.05)}
    .audio-btn:active{transform:translateY(-50%) scale(.95)}
    .audio-btn.playing{background:#143e52}
    .audio-btn svg{width:14px;height:14px;fill:currentColor}
    .audio-btn span{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);background:rgba(20,62,82,.92);color:white;padding:2px 6px;border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
    .audio-btn:hover span,.audio-btn:focus-visible span{opacity:1}
    .editbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 14px}
    .editbar button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(17,47,63,.09)}
    .editbar button.primary{background:var(--ink);color:#fff}
    .editbar button:disabled{opacity:.45;cursor:not-allowed}
    body.edit-mode .audio-btn{outline:2px dashed rgba(11,132,255,.45);outline-offset:4px;cursor:grab;touch-action:none}
    body.edit-mode .audio-btn:active{cursor:grabbing}
    .edit-note{text-align:center;font-size:12px;opacity:.7;margin:-4px 0 14px;display:none}
    body.edit-mode .edit-note{display:block}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#143e52;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
    .toast.show{opacity:1}
    .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
    .controls button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(17,47,63,.09)}
    .counter{min-width:76px;text-align:center;font-weight:800}
    footer{text-align:center;font-size:12px;opacity:.58;padding:0 16px 36px}
    @media (max-width:700px){.topbar{padding:10px 12px}.brand img{width:155px;max-height:38px}.brand small{font-size:10px}main{padding:12px 8px 36px}.slide{border-radius:8px}.audio-btn{width:22px;height:22px}.audio-btn svg{width:13px;height:13px}.hint{font-size:12px;margin-bottom:10px}.controls{margin-top:12px}}
  </style>
</head>

  (hotspots[p]||[]).forEach(([word,x,y])=>{
    const b=document.createElement('button');
    const key=`${p}:${word}`;
    const pos=savedLayout[key] || {x,y};
    b.className='audio-btn';
    b.style.left=pos.x+'%';
    b.style.top=pos.y+'%';
    b.dataset.word=word;
    b.dataset.page=p;
    b.setAttribute('aria-label',`${word} の発音を再生`);
    b.innerHTML=playIcon+`<span>${word}</span>`;
    b.addEventListener('click',(e)=>{
      if(editMode){ e.preventDefault(); return; }
      playWord(word,b);
    });
    b.addEventListener('pointerdown',(e)=>{
      if(!editMode) return;
      e.preventDefault();
      stopAudio();
      b.setPointerCapture?.(e.pointerId);
      dragState={button:b,slide:s,pointerId:e.pointerId};
    });
    b.addEventListener('pointermove',(e)=>{
      if(!editMode || !dragState || dragState.button!==b) return;
      const rect=s.getBoundingClientRect();
      let xPct=((e.clientX-rect.left)/rect.width)*100;
      let yPct=((e.clientY-rect.top)/rect.height)*100;
      xPct=Math.max(1,Math.min(97,xPct));
      yPct=Math.max(2,Math.min(98,yPct));
      b.style.left=xPct.toFixed(2)+'%';
      b.style.top=yPct.toFixed(2)+'%';
    });
    const endDrag=(e)=>{
      if(!dragState || dragState.button!==b) return;
      try{ b.releasePointerCapture?.(e.pointerId); }catch(_){}
      dragState=null;
    };
    b.addEventListener('pointerup',endDrag);
    b.addEventListener('pointercancel',endDrag);
    s.appendChild(b);
  });
  slidesEl.appendChild(s);
  const n=document.createElement('button'); n.textContent=p; n.addEventListener('click',()=>showPage(p)); navEl.appendChild(n);
}

function stopAudio(){
  if(activeAudio){activeAudio.pause(); activeAudio.currentTime=0;}
  if(activeButton){activeButton.classList.remove('playing'); activeButton.innerHTML=playIcon+`<span>${activeButton.dataset.word||''}</span>`;}
  activeAudio=null; activeButton=null;
}

function playWord(word,button){
  if(activeButton===button && activeAudio && !activeAudio.paused){stopAudio();return;}
  stopAudio();
  const audio=new Audio(`public/audio/${word}.mp3`);
  button.dataset.word=word; button.classList.add('playing'); button.innerHTML=pauseIcon+`<span>${word}</span>`;
  activeAudio=audio; activeButton=button;
  audio.addEventListener('ended',()=>stopAudio(),{once:true});
  audio.addEventListener('error',()=>{stopAudio(); alert(`${word} の音声を読み込めませんでした。`);},{once:true});
  audio.play().catch(()=>{stopAudio();});
}

function showToast(message){
  toastEl.textContent=message;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>toastEl.classList.remove('show'),1400);
}

function collectLayout(){
  const data={};
  document.querySelectorAll('.audio-btn').forEach(b=>{
    data[`${b.dataset.page}:${b.dataset.word}`]={
      x:parseFloat(b.style.left),
      y:parseFloat(b.style.top)
    };
  });
  return data;
}

function applyDefaultLayout(){
  document.querySelectorAll('.audio-btn').forEach(b=>{
    const page=Number(b.dataset.page);
    const item=(hotspots[page]||[]).find(([word])=>word===b.dataset.word);
    if(item){ b.style.left=item[1]+'%'; b.style.top=item[2]+'%'; }
  });
}

function setEditMode(on){
  editMode=on;
  document.body.classList.toggle('edit-mode',on);
  editToggle.textContent=on?'編集を終了':'位置を編集';
  saveLayoutBtn.disabled=!on;
  resetLayoutBtn.disabled=!on;
  copyLayoutBtn.disabled=!on;
  if(on) stopAudio();
}

editToggle.addEventListener('click',()=>setEditMode(!editMode));
saveLayoutBtn.addEventListener('click',()=>{
  savedLayout=collectLayout();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(savedLayout));
  showToast('このブラウザに位置を保存しました');
});
resetLayoutBtn.addEventListener('click',()=>{
  applyDefaultLayout();
  localStorage.removeItem(STORAGE_KEY);
  savedLayout={};
  showToast('初期位置に戻しました');
});
copyLayoutBtn.addEventListener('click',async()=>{
  const text=JSON.stringify(collectLayout(),null,2);
  try{
    await navigator.clipboard.writeText(text);
    showToast('配置データをコピーしました');
  }catch(_){
    showToast('コピーできませんでした');
  }
});

function showPage(p){
  stopAudio(); current=Math.min(6,Math.max(1,p));
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('active',Number(el.dataset.page)===current));
  [...navEl.children].forEach((el,i)=>el.classList.toggle('active',i+1===current));
  document.getElementById('counter').textContent=`${current} / 6`;
  document.getElementById('prev').disabled=current===1;
  document.getElementById('next').disabled=current===6;
}
document.getElementById('prev').addEventListener('click',()=>showPage(current-1));
document.getElementById('next').addEventListener('click',()=>showPage(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')showPage(current+1);if(e.key==='ArrowLeft')showPage(current-1);});
showPage(1);
</script>
