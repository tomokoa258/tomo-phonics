<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8eb6cd" />
  <title>Tomo English｜フォニックス d & t</title>
  <style>
    :root{--blue:#8eb6cd;--ink:#243f4c;--white:#fff;--accent:#0b84ff;--shadow:0 12px 32px rgba(17,47,63,.16)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#eef5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
    header{position:sticky;top:0;z-index:20;background:rgba(238,245,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(36,63,76,.08)}
    .topbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:800;letter-spacing:.01em}.brand small{display:block;font-size:12px;font-weight:600;opacity:.65}
    .nav{display:flex;gap:6px;overflow:auto;padding-bottom:1px}
    .nav button{border:0;background:#fff;color:var(--ink);width:34px;height:34px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(17,47,63,.08)}
    .nav button.active{background:var(--ink);color:#fff}
    main{max-width:1180px;margin:0 auto;padding:22px 16px 52px}
    .hint{margin:0 auto 18px;text-align:center;font-size:14px;line-height:1.7;opacity:.78}
    .slide{display:none;position:relative;margin:auto;aspect-ratio:16/9;max-width:1080px;background:#fff;box-shadow:var(--shadow);overflow:hidden;border-radius:14px}
    .slide.active{display:block}
    .slide img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .audio-btn{position:absolute;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(11,132,255,.94);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 7px 18px rgba(0,78,158,.24);transition:transform .12s ease,background .12s ease;z-index:5}
    .audio-btn:hover{transform:translateY(-50%) scale(1.05)}
    .audio-btn:active{transform:translateY(-50%) scale(.95)}
    .audio-btn.playing{background:#143e52}
    .audio-btn svg{width:22px;height:22px;fill:currentColor}
    .audio-btn span{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);background:rgba(20,62,82,.92);color:white;padding:2px 6px;border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
    .audio-btn:hover span,.audio-btn:focus-visible span{opacity:1}
    .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
    .controls button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(17,47,63,.09)}
    .counter{min-width:76px;text-align:center;font-weight:800}
    footer{text-align:center;font-size:12px;opacity:.58;padding:0 16px 36px}
    @media (max-width:700px){.topbar{padding:10px 12px}.brand{font-size:14px}.brand small{font-size:10px}main{padding:12px 8px 36px}.slide{border-radius:8px}.audio-btn{width:32px;height:32px}.audio-btn svg{width:19px;height:19px}.hint{font-size:12px;margin-bottom:10px}.controls{margin-top:12px}}
  </style>
</head>
<body>
<header><div class="topbar"><div class="brand">Tomo English<small>フォニックス｜d & t</small></div><div class="nav" id="nav"></div></div></header>
<main>
  <p class="hint">3・5ページでは、青い 🔊 ボタンを押すと単語の音声が再生されます。d / t の単音はレッスン内で先生が発音します。</p>
  <section id="slides"></section>
  <div class="controls"><button id="prev">← 前へ</button><div class="counter" id="counter"></div><button id="next">次へ →</button></div>
</main>
<footer>© Tomo English</footer>
<script>
const playIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zm0-8.5v2.06A8 8 0 0 1 20 12a8 8 0 0 1-3.5 6.44v2.06A10 10 0 0 0 22 12a10 10 0 0 0-5.5-8.5z"/></svg>`;
const pauseIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;

// x/y are percentages within the 16:9 slide.
const hotspots = {
  3: [
    ['dog',59.5,41.7], ['dentist',59.5,55.7], ['door',59.5,69.7], ['dad',59.5,83.7],
    ['bad',93.4,41.7], ['mad',93.4,55.7], ['salad',93.4,69.7], ['hand',93.4,83.7]
  ],
  5: [
    ['table',62.0,41.7], ['tennis',62.0,55.7], ['teacher',62.0,69.7], ['tent',62.0,83.7],
    ['cut',94.0,41.7], ['chat',94.0,55.7], ['great',94.0,69.7], ['last',94.0,83.7]
  ]
};

const slidesEl = document.getElementById('slides');
const navEl = document.getElementById('nav');
let current = 1;
let activeAudio = null;
let activeButton = null;

for(let p=1;p<=6;p++){
  const s=document.createElement('div'); s.className='slide'; s.dataset.page=p;
  const img=document.createElement('img'); img.src=`public/pages/page-${p}.png`; img.alt=`フォニックス d & t ページ ${p}`; s.appendChild(img);
  (hotspots[p]||[]).forEach(([word,x,y])=>{
    const b=document.createElement('button');
    b.className='audio-btn'; b.style.left=x+'%'; b.style.top=y+'%';
    b.setAttribute('aria-label',`${word} の発音を再生`); b.innerHTML=playIcon+`<span>${word}</span>`;
    b.addEventListener('click',()=>playWord(word,b)); s.appendChild(b);
  });
  slidesEl.appendChild(s);
  const n=document.createElement('button'); n.textContent=p; n.addEventListener('click',()=>showPage(p)); navEl.appendChild(n);
}

function stopAudio(){
  if(activeAudio){activeAudio.pause(); activeAudio.currentTime=0;}
  if(activeButton){activeButton.classList.remove('playing'); activeButton.innerHTML=playIcon+`<span>${activeButton.dataset.word||''}</span>`;}
  activeAudio=null; activeButton=null;
}

function playWord(word,button){
  if(activeButton===button && activeAudio && !activeAudio.paused){stopAudio();return;}
  stopAudio();
  const audio=new Audio(`public/audio/${word}.mp3`);
  button.dataset.word=word; button.classList.add('playing'); button.innerHTML=pauseIcon+`<span>${word}</span>`;
  activeAudio=audio; activeButton=button;
  audio.addEventListener('ended',()=>stopAudio(),{once:true});
  audio.addEventListener('error',()=>{stopAudio(); alert(`${word} の音声を読み込めませんでした。`);},{once:true});
  audio.play().catch(()=>{stopAudio();});
}

function showPage(p){
  stopAudio(); current=Math.min(6,Math.max(1,p));
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('active',Number(el.dataset.page)===current));
  [...navEl.children].forEach((el,i)=>el.classList.toggle('active',i+1===current));
  document.getElementById('counter').textContent=`${current} / 6`;
  document.getElementById('prev').disabled=current===1;
  document.getElementById('next').disabled=current===6;
}
document.getElementById('prev').addEventListener('click',()=>showPage(current-1));
document.getElementById('next').addEventListener('click',()=>showPage(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')showPage(current+1);if(e.key==='ArrowLeft')showPage(current-1);});
showPage(1);
</script>
</body>
</html>
