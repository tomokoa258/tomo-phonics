<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef5f8">
<title>Study Mate｜フォニックス p & w</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eef5f8;color:#243f4c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(238,245,248,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(36,63,76,.08)}
.topbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;font-size:20px}.brand small{font-size:12px;font-weight:700;opacity:.62;margin-left:10px}
.back{border:0;border-radius:999px;background:#fff;color:#243f4c;padding:9px 14px;font-weight:800;text-decoration:none;box-shadow:0 3px 10px rgba(17,47,63,.09)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
.note{text-align:center;font-size:13px;opacity:.72;margin:0 0 14px}
.viewer{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px rgba(17,47,63,.16)}
.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
footer{text-align:center;font-size:12px;opacity:.58;padding:0 16px 30px}
@media(max-width:700px){.topbar{padding:10px 12px}.brand{font-size:17px}.brand small{display:none}main{padding:12px 8px 36px}.viewer{border-radius:8px}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">Study Mate <small>フォニックス｜p & w</small></div>
    <a class="back" href="/">D&amp;Tへ戻る</a>
  </div>
</header>
<main>
  <p class="note">Canvaの元デザインをそのまま表示しています。文字・イラスト・配置は変更していません。</p>
  <div class="viewer">
    <iframe
      src="https://www.canva.com/design/DAGw5sZkqQ4/view?embed"
      title="Phonics (基本)- p & w"
      loading="eager"
      allowfullscreen="allowfullscreen"
      allow="fullscreen">
    </iframe>
  </div>
</main>
<footer>© Study Mate</footer>
</body>
</html>
