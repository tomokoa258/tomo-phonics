<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8eb6cd" />
  <title>Study Mate｜フォニックス f & h</title>
  <style>
    :root{--blue:#8eb6cd;--ink:#243f4c;--white:#fff;--accent:#0b84ff;--shadow:0 12px 32px rgba(17,47,63,.16)}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:#eef5f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
    header{position:sticky;top:0;z-index:20;background:rgba(238,245,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(36,63,76,.08)}
    .topbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:900;font-size:20px}.brand small{font-size:12px;font-weight:700;opacity:.65;margin-left:8px}
    .nav{display:flex;gap:6px;overflow:auto;padding-bottom:1px}
    .nav button{border:0;background:#fff;color:var(--ink);width:34px;height:34px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(17,47,63,.08)}
    .nav button.active{background:var(--ink);color:#fff}
    main{max-width:1180px;margin:0 auto;padding:22px 16px 52px}
    .hint{margin:0 auto 18px;text-align:center;font-size:14px;line-height:1.7;opacity:.78}
    .slide{display:none;position:relative;margin:auto;aspect-ratio:16/9;max-width:1080px;background:#fff;box-shadow:var(--shadow);overflow:hidden;border-radius:14px}
    .slide.active{display:block}
    .slide>img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .audio-btn{position:absolute;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.96);background:rgba(11,132,255,.94);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,78,158,.18);z-index:5}
    .audio-btn.playing{background:#143e52}.audio-btn svg{width:14px;height:14px;fill:currentColor}
    .audio-btn span{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);background:rgba(20,62,82,.92);color:white;padding:2px 6px;border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none}
    .audio-btn:hover span,.audio-btn:focus-visible span{opacity:1}
    .editbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 14px}
    .editbar button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(17,47,63,.09)}
    .editbar button.primary{background:var(--ink);color:#fff}.editbar button:disabled{opacity:.45;cursor:not-allowed}
    body.edit-mode .audio-btn{outline:2px dashed rgba(11,132,255,.45);outline-offset:4px;cursor:grab;touch-action:none}
    .edit-note{text-align:center;font-size:12px;opacity:.7;margin:-4px 0 14px;display:none}body.edit-mode .edit-note{display:block}
    .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
    .controls button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(17,47,63,.09)}
    .counter{min-width:76px;text-align:center;font-weight:800}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#143e52;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}.toast.show{opacity:1}
    footer{text-align:center;font-size:12px;opacity:.58;padding:0 16px 36px}
    @media(max-width:700px){.topbar{padding:10px 12px}.brand{font-size:17px}.brand small{display:none}main{padding:12px 8px 36px}.slide{border-radius:8px}.audio-btn{width:22px;height:22px}.audio-btn svg{width:13px;height:13px}.hint{font-size:12px;margin-bottom:10px}}
  </style>
</head>
<body>
<header><div class="topbar"><div class="brand">Study Mate <small>フォニックス｜f & h</small></div><div class="nav" id="nav"></div></div></header>
<main>
  <p class="hint">Canvaから書き出した完成スライドをそのまま表示しています。単語練習・聞き分けページの青い 🔊 ボタンで発音を確認できます。</p>
  <div class="editbar">
    <button id="editToggle" class="primary">位置を編集</button>
    <button id="saveLayout" disabled>位置を保存</button>
    <button id="resetLayout" disabled>初期位置に戻す</button>
    <button id="copyLayout" disabled>配置データをコピー</button>
  </div>
  <p class="edit-note">編集モード：青い再生ボタンをドラッグして位置を調整できます。</p>
  <section id="slides"></section>
  <div class="controls"><button id="prev">← 前へ</button><div class="counter" id="counter"></div><button id="next">次へ →</button></div>
</main>
<div class="toast" id="toast"></div>
<footer>© Study Mate</footer>
<script>
const playIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zm0-8.5v2.06A8 8 0 0 1 20 12a8 8 0 0 1-3.5 6.44v2.06A10 10 0 0 0 22 12a10 10 0 0 0-5.5-8.5z"/></svg>`;
const pauseIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
const hotspots={
  3:[
    ['fish',54.0,40.0],['fan',53.0,53.5],['family',55.0,67.0],['fence',54.0,80.5]
  ],
  4:[
    ['beef',54.0,40.0],['sofa',54.0,53.5],['cafe',54.0,67.0],['golf',54.0,80.5]
  ],
  6:[
    ['happy',54.0,40.0],['help',54.0,53.5],['horse',54.0,67.0],['hat',53.0,80.5]
  ],
  7:[
    ['behind',55.0,40.0],['ahead',54.0,53.5],['beehive',56.0,67.0],['behave',55.5,80.5]
  ],
  9:[
    ['fat',46.0,29.0],['hat',63.0,29.0],
    ['feel',46.0,42.0],['heal',63.0,42.0],
    ['fit',46.0,55.5],['hit',63.0,55.5],
    ['fail',46.0,69.0],['hail',63.0,69.0],
    ['ferry',46.0,82.5],['hurry',63.0,82.5]
  ],
  10:[
    ['fat',46.0,53.0],['hat',78.0,53.0]
  ],
  11:[
    ['feel',46.0,53.0],['heal',78.0,53.0]
  ],
  12:[
    ['fit',46.0,53.0],['hit',78.0,53.0]
  ],
  13:[
    ['fail',46.0,53.0],['hail',78.0,53.0]
  ],
  14:[
    ['ferry',46.0,53.0],['hurry',78.0,53.0]
  ]
};
const STORAGE_KEY='study-mate-fh-layout-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(_){}
const slidesEl=document.getElementById('slides'),nav=document.getElementById('nav'),counter=document.getElementById('counter');
const editToggle=document.getElementById('editToggle'),saveBtn=document.getElementById('saveLayout'),resetBtn=document.getElementById('resetLayout'),copyBtn=document.getElementById('copyLayout'),toast=document.getElementById('toast');
let current=1,editMode=false,drag=null,speakingButton=null;
speechSynthesis.getVoices();
if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

for(let p=1;p<=14;p++){
  const s=document.createElement('div');s.className='slide';s.dataset.page=p;
  const img=document.createElement('img');img.src=`pages/page-${p}.jpg`;img.alt=`フォニックス f & h ページ ${p}`;s.appendChild(img);
  (hotspots[p]||[]).forEach(([word,x,y,label,rate])=>{
    const key=`${p}:${word}`,pos=saved[key]||{x,y};
    const displayLabel=label||word;
    const b=document.createElement('button');b.className='audio-btn';b.dataset.word=word;b.dataset.label=displayLabel;b.dataset.rate=rate||.82;b.dataset.page=p;b.style.left=pos.x+'%';b.style.top=pos.y+'%';b.innerHTML=playIcon+`<span>${displayLabel}</span>`;b.setAttribute('aria-label',displayLabel+' の音声を再生');
    b.addEventListener('click',e=>{if(editMode){e.preventDefault();return} speak(word,b)});
    b.addEventListener('pointerdown',e=>{if(!editMode)return;e.preventDefault();b.setPointerCapture?.(e.pointerId);drag={b,s,id:e.pointerId}});
    b.addEventListener('pointermove',e=>{if(!drag||drag.b!==b)return;const r=s.getBoundingClientRect();let xp=(e.clientX-r.left)/r.width*100,yp=(e.clientY-r.top)/r.height*100;xp=Math.max(1,Math.min(97,xp));yp=Math.max(2,Math.min(98,yp));b.style.left=xp.toFixed(2)+'%';b.style.top=yp.toFixed(2)+'%'});
    const end=e=>{if(!drag||drag.b!==b)return;try{b.releasePointerCapture?.(e.pointerId)}catch(_){}drag=null};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
    s.appendChild(b);
  });
  slidesEl.appendChild(s);
  const n=document.createElement('button');n.textContent=p;n.addEventListener('click',()=>show(p));nav.appendChild(n);
}
function chooseUSVoice(){
  const voices=speechSynthesis.getVoices();
  const us=voices.filter(v=>/^en-US$/i.test(v.lang)||/^en_US$/i.test(v.lang));
  const preferred=[
    /Samantha/i,/Ava/i,/Allison/i,/Susan/i,/Alex/i,
    /Google US English/i,/Microsoft Aria/i,/Microsoft Jenny/i
  ];
  for(const re of preferred){
    const v=us.find(v=>re.test(v.name));
    if(v)return v;
  }
  return us[0]||voices.find(v=>/^en/i.test(v.lang))||null;
}
function speak(word,b){
  speechSynthesis.cancel();
  document.querySelectorAll('.audio-btn.playing').forEach(x=>{
    x.classList.remove('playing');
    x.innerHTML=playIcon+`<span>${x.dataset.label||x.dataset.word}</span>`;
  });
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';
  u.rate=parseFloat(b.dataset.rate||'.82');
  u.pitch=1;
  const voice=chooseUSVoice();
  if(voice)u.voice=voice;
  const label=b.dataset.label||word;
  b.classList.add('playing');
  b.innerHTML=pauseIcon+`<span>${label}</span>`;
  speakingButton=b;
  u.onend=u.onerror=()=>{
    b.classList.remove('playing');
    b.innerHTML=playIcon+`<span>${label}</span>`;
    speakingButton=null;
  };
  speechSynthesis.speak(u);
}
function show(p){current=Math.max(1,Math.min(14,p));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current-1));[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===current-1));counter.textContent=current+' / 14';speechSynthesis.cancel()}
function layout(){const d={};document.querySelectorAll('.audio-btn').forEach(b=>d[`${b.dataset.page}:${b.dataset.word}`]={x:parseFloat(b.style.left),y:parseFloat(b.style.top)});return d}
function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),1400)}
editToggle.onclick=()=>{editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);editToggle.textContent=editMode?'編集を終了':'位置を編集';saveBtn.disabled=resetBtn.disabled=copyBtn.disabled=!editMode;speechSynthesis.cancel()};
saveBtn.onclick=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(layout()));toastMsg('位置を保存しました')};
resetBtn.onclick=()=>{localStorage.removeItem(STORAGE_KEY);location.reload()};
copyBtn.onclick=async()=>{const t=JSON.stringify(layout(),null,2);try{await navigator.clipboard.writeText(t);toastMsg('配置データをコピーしました')}catch(_){prompt('配置データ',t)}};
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(1);
</script>
</body></html>
