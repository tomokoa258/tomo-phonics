<style>
:root{--bg:#edf6fa;--ink:#173d50;--blue:#0b84ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(237,246,250,.96);border-bottom:1px solid rgba(23,61,80,.09);backdrop-filter:blur(10px)}
.topbar{max-width:1280px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{display:block;width:205px;max-height:46px;object-fit:contain;mix-blend-mode:multiply}.brand small{font-weight:700;opacity:.65}
.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.nav button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(23,61,80,.08)}
.nav button.active{background:var(--ink);color:#fff;outline:2px solid var(--blue)}
main{max-width:1280px;margin:0 auto;padding:18px 14px 34px}
.hint{text-align:center;font-size:14px;opacity:.72;margin:2px 0 12px}
.editbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 14px}
.editbar button{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(17,47,63,.09)}
.editbar button.primary{background:var(--ink);color:#fff}.editbar button:disabled{opacity:.45;cursor:not-allowed}
.edit-note{text-align:center;font-size:12px;opacity:.7;margin:-4px 0 14px;display:none}body.edit-mode .edit-note{display:block}
.slide{position:relative;display:none;aspect-ratio:16/9;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 14px 36px rgba(21,60,79,.12)}
.slide.active{display:block}
.slide>img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.audio-btn{position:absolute;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.96);background:rgba(11,132,255,.94);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,78,158,.18);z-index:5}
.audio-btn svg{width:14px;height:14px;fill:currentColor}.audio-btn span{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);background:#173d50;color:#fff;border-radius:5px;padding:2px 5px;font-size:10px;opacity:0;pointer-events:none;white-space:nowrap}
.audio-btn:hover span,.audio-btn:focus-visible span{opacity:1}
body.edit-mode .audio-btn{outline:2px dashed rgba(11,132,255,.45);outline-offset:4px;cursor:grab;touch-action:none}
body.edit-mode .audio-btn:active{cursor:grabbing}
.controls{display:flex;justify-content:center;gap:22px;margin:16px 0 0}
.controls button{border:0;border-radius:999px;background:#fff;padding:11px 24px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 5px 16px rgba(23,61,80,.08)}
footer{text-align:center;opacity:.55;padding:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#143e52;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}.toast.show{opacity:1}
@media(max-width:700px){.topbar{padding:8px}.brand img{width:145px;max-height:34px}.brand small{font-size:10px}.nav button{width:31px;height:31px}.audio-btn{width:22px;height:22px}.audio-btn svg{width:13px;height:13px}main{padding:10px 5px 24px}.slide{border-radius:8px}}
</style>

es%3DTue%252C%252029%2520Sep%25202026%252004%253A21%253A04%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKxhhi9Ypjf0Tyry0zoVkxneh3jAgnAxhF_GNJVdT9LL&page=7&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=91","https://media.canva.com/v2/document-image/hash:968380309/height:335/id:DAGw5sZkqQ4/type:B/width:596?brand=BAFKGWGNs68&csig=AAAAAAAAAAAAAAAAAAAAAHerjC6mZ_Ce4rtc8PTe2pVnKPQexeyMqZIxbH61zpsY&disableexport=T&exp=1790652964&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZkqQ4%2FDAGw5sZkqQ4%2F90%2Fthumbnail%2F0008.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260928%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260928T172751Z%26X-Amz-Expires%3D39193%26X-Amz-Signature%3Dcfa77a33b4d82ca59cc0fa073cf420de3b3bdf89c19ee2e6582ab8c6fca6cae5%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252029%2520Sep%25202026%252004%253A21%253A04%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKMla2hEHc3QqP96X7VukEwxGS6KXoMRjPo2DFu-JviE&page=8&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=91"];
const initialHotspots={
  3:[
    ['pen',53.0,41.7],['panda',57.5,55.7],['pack',53.5,69.7],['apple',56.5,83.7],
    ['mop',90.0,41.7],['open',90.5,55.7],['laptop',92.0,69.7],['pot',89.5,83.7]
  ],
  6:[
    ['wood',54.5,41.7],['winter',56.5,55.7],['wish',54.0,69.7],['wagon',57.0,83.7],
    ['highway',92.0,41.7],['sandwich',93.0,55.7],['power',91.0,69.7],['twin',89.5,83.7]
  ]
};
const STORE='study-mate-pw-layout-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(_){}
const slides=document.getElementById('slides'),nav=document.getElementById('nav');
const editToggle=document.getElementById('editToggle'),saveBtn=document.getElementById('saveLayout'),resetBtn=document.getElementById('resetLayout'),copyBtn=document.getElementById('copyLayout'),toast=document.getElementById('toast');
let current=1,editMode=false,drag=null;
const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zm0-8.5v2.06A7 7 0 0 1 20 12a7 7 0 0 1-3.5 6.44v2.06A9 9 0 0 0 22 12a9 9 0 0 0-5.5-8.5z"/></svg>';

function speak(word){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.82;
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^en-US/i.test(x.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
function collect(){const o={};document.querySelectorAll('.audio-btn').forEach(b=>o[b.dataset.page+':'+b.dataset.word]={x:+parseFloat(b.style.left).toFixed(2),y:+parseFloat(b.style.top).toFixed(2)});return o}
function defaults(){document.querySelectorAll('.audio-btn').forEach(b=>{const item=(initialHotspots[+b.dataset.page]||[]).find(x=>x[0]===b.dataset.word);if(item){b.style.left=item[1]+'%';b.style.top=item[2]+'%'}})}
function setEdit(on){editMode=on;document.body.classList.toggle('edit-mode',on);editToggle.textContent=on?'編集を終了':'位置を編集';saveBtn.disabled=resetBtn.disabled=copyBtn.disabled=!on;speechSynthesis.cancel()}
editToggle.onclick=()=>setEdit(!editMode);
saveBtn.onclick=()=>{saved=collect();localStorage.setItem(STORE,JSON.stringify(saved));showToast('位置を保存しました')};
resetBtn.onclick=()=>{defaults();localStorage.removeItem(STORE);saved={};showToast('初期位置に戻しました')};
copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(collect(),null,2));showToast('配置データをコピーしました')}catch(_){showToast('コピーできませんでした')}};

pageUrls.forEach((url,i)=>{
  const p=i+1,s=document.createElement('div');s.className='slide';s.dataset.page=p;
  const img=document.createElement('img');img.src=url;img.alt='フォニックス p & w ページ '+p;s.appendChild(img);
  (initialHotspots[p]||[]).forEach(([word,x,y])=>{
    const key=p+':'+word,pos=saved[key]||{x,y},b=document.createElement('button');
    b.className='audio-btn';b.style.left=pos.x+'%';b.style.top=pos.y+'%';b.dataset.word=word;b.dataset.page=p;b.setAttribute('aria-label',word+' の発音を再生');b.innerHTML=icon+'<span>'+word+'</span>';
    b.onclick=e=>{if(editMode){e.preventDefault();return}speak(word)};
    b.onpointerdown=e=>{if(!editMode)return;e.preventDefault();b.setPointerCapture?.(e.pointerId);drag={b,s,id:e.pointerId}};
    b.onpointermove=e=>{if(!drag||drag.b!==b)return;const r=s.getBoundingClientRect();let xx=(e.clientX-r.left)/r.width*100,yy=(e.clientY-r.top)/r.height*100;xx=Math.max(1,Math.min(97,xx));yy=Math.max(2,Math.min(98,yy));b.style.left=xx.toFixed(2)+'%';b.style.top=yy.toFixed(2)+'%'};
    const end=e=>{if(drag&&drag.b===b){try{b.releasePointerCapture?.(e.pointerId)}catch(_){}drag=null}};b.onpointerup=end;b.onpointercancel=end;s.appendChild(b);
  });
  slides.appendChild(s);
  const n=document.createElement('button');n.textContent=p;n.onclick=()=>show(p);nav.appendChild(n);
});
function show(p){current=Math.max(1,Math.min(pageUrls.length,p));document.querySelectorAll('.slide').forEach(x=>x.classList.toggle('active',+x.dataset.page===current));[...nav.children].forEach((x,i)=>x.classList.toggle('active',i+1===current));window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
show(1);
</script>
