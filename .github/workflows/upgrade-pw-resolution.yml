            'https://media.canva.com/v2/document-image/hash:1460599817/height:1080/id:DAGw5sZkqQ4/type:B/width:1920?brand=BAFKGWGNs68&csig=AAAAAAAAAAAAAAAAAAAAACXlM84kiD-TAFPerPba69nlHhMhDi5b9ExcSLQwSvVA&disableexport=T&exp=1790667608&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZkqQ4%2FDAGw5sZkqQ4%2F90%2Fthumbnail%2F0007.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260928%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260928T122337Z%26X-Amz-Expires%3D72091%26X-Amz-Signature%3Dd79129f4a6a90c9cbfde4fc04cd8695d46daace18ccfe442d8e1aa7d1438e1b0%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252029%2520Sep%25202026%252008%253A25%253A08%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAK8CNfs7MMHbt1FM0jqmYY08D6tb8fD_X2y9PGOp-U3M&page=7&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=92'
            'https://media.canva.com/v2/document-image/hash:968380309/height:1080/id:DAGw5sZkqQ4/type:B/width:1920?brand=BAFKGWGNs68&csig=AAAAAAAAAAAAAAAAAAAAALk6CnhqMlY6tWAE8GgeXUF45UxDCNfIqySKIP9LBD8A&disableexport=T&exp=1790667608&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZkqQ4%2FDAGw5sZkqQ4%2F90%2Fthumbnail%2F0008.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260928%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260928T172751Z%26X-Amz-Expires%3D53837%26X-Amz-Signature%3D4200895158d989b0cde11fb001dcb6783bc5761818ea4a0e140894fb386f8f76%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252029%2520Sep%25202026%252008%253A25%253A08%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAGw-sMkZiWHkD2BSDvCNfQPEBQllQQ6DnQqQHD_VVKc9&page=8&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=92'
          )
          for i in "${!urls[@]}"; do
            n=$((i+1))
            echo "Downloading page $n..."
            curl -L --fail --retry 3 --retry-delay 2 "${urls[$i]}" -o "$out/page-$n.png"
            python - "$out/page-$n.png" <<'PY'
import struct, sys
p=sys.argv[1]
with open(p,'rb') as f:
    sig=f.read(24)
if sig[:8] != b'\x89PNG\r\n\x1a\n':
    raise SystemExit(f"{p}: not a PNG")
w,h=struct.unpack(">II",sig[16:24])
print(f"{p}: {w}x{h}")
if w < 1800 or h < 1000:
    raise SystemExit(f"{p}: resolution too small ({w}x{h})")
PY
          done

      - name: Commit high-resolution pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Study Mate Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tomo_phonics_site/lessons/p-w/pages
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Upgrade p-w slides to high resolution"
          git pull --rebase origin main
          git push origin main
