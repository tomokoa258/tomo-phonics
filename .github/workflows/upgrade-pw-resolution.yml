            'https://media.canva.com/v2/document-image/hash:173934472/height:1080/id:DAGw5sZkqQ4/type:B/width:1920?brand=BAFKGWGNs68&csig=AAAAAAAAAAAAAAAAAAAAAOy30Cj1REtssUygdP3k4__7aSoeT2xun8w0ZiuW2opD&disableexport=T&exp=1790667608&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZkqQ4%2FDAGw5sZkqQ4%2F90%2Fthumbnail%2F0005.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260929%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260929T070929Z%26X-Amz-Expires%3D4539%26X-Amz-Signature%3D44aeffa62eb51918a8d999484c719e5a8dcb7fc7b5ad18e39bd0758416e59a35%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252029%2520Sep%25202026%252008%253A25%253A08%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAABWmQ0kgaf3fMDXNN5-C3tMDl6nOVoNt2IqTo3omcqyx&page=5&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=92'
