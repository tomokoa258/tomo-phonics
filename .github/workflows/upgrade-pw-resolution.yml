name: Upgrade p-w slide resolution

on:
  push:
    paths:
      - ".github/workflows/upgrade-pw-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download high-resolution Canva pages
        shell: bash
        run: |
          set -euo pipefail
          out="tomo_phonics_site/lessons/p-w/pages"
          mkdir -p "$out"
          urls=(
            'https://media.canva.com/v2/document-image/hash:-753735525/height:1080/id:DAGw5sZkqQ4/type:B/width:1920?brand=BAFKGWGNs68&csig=AAAAAAAAAAAAAAAAAAAAACFsPusEV7Lw4BdiJavQbely1GyzZwYDuQWkcGgB30gb&disableexport=T&exp=1790667608&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FZkqQ4%2FDAGw5sZkqQ4%2F92%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260928%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260928T231322Z%26X-Amz-Expires%3D33106%26X-Amz-Signature%3D0f544fa2cbdde6082b1652a5c7d0e87a14d93af7c2e8032c0b904eead314ba91%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252029%2520Sep%25202026%252008%253A25%253A08%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAGMxt1ljhdPYWq7vmZx6RhiwnJY11A-sYH1t8wGzyDlh&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=92'
